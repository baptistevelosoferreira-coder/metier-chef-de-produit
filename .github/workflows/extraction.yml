name: Extraction France Travail

# Pour lancer : onglet Actions > Extraction France Travail > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Extraction des offres
        id: extraction
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python extraction.py

      - name: Enregistrer la version (commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "première extraction France Travail, ${{ steps.extraction.outputs.nombre }} offres, $(date +%Y-%m-%d)"
          git push
